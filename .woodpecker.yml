# .woodpecker.yml
#
# On every push to main that touches docs/, mirrors docs/ into the
# "pages" branch so Codeberg Pages serves the latest landing page.
#
# Requires two secrets set in the Woodpecker CI settings for this repo
# (https://ci.codeberg.org -> repo -> Settings -> Secrets):
#   codeberg_token - access token with Repository "Read and Write" scope
#   mail           - email address to use for the sync commit's author

when:
  branch: main
  event: push
  path:
    include: ["docs/**"]

steps:
  publish:
    image: alpine/git
    environment:
      MAIL:
        from_secret: mail
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - git config --global user.email "$MAIL"
      - git config --global user.name "Woodpecker CI"
      - git clone -b pages https://$CODEBERG_TOKEN@codeberg.org/$CI_REPO.git pages-branch
      - find pages-branch -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
      - cp -ar docs/. pages-branch/
      - cd pages-branch
      - git add -A
      - git diff --cached --quiet || git commit -m "chore: sync pages from docs/ (${CI_COMMIT_SHA})"
      - git push
    when:
      event: push
      branch: main
