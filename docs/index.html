<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitralis — your screen, with memory</title>
<meta name="description" content="Vitralis is a persistent, click-through screen overlay for Windows. Draw annotations over your live desktop and they stay — across sessions, across reboots.">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Gruvbox palette: https://github.com/morhetz/gruvbox */
  :root {
    color-scheme: light dark;
  }
  /* Dark is the default look regardless of system preference; light is
     opt-in only via the theme toggle (and remembered from then on). */
  :root, :root[data-theme="dark"] {
    --bg: #282828;        /* gruvbox dark bg0 */
    --bg-alt: #1d2021;    /* gruvbox dark bg0_h */
    --fg: #ebdbb2;        /* gruvbox dark fg1 */
    --fg-muted: #a89984;  /* gruvbox dark fg4 */
    --card-bg: #3c3836;   /* gruvbox dark bg1 */
    --card-border: #504945; /* gruvbox dark bg2 */
    --accent: #fe8019;    /* gruvbox dark bright orange */
    --shadow: rgba(0, 0, 0, 0.45);
    --blue: #83a598;      /* gruvbox dark bright blue */
    --violet: #d3869b;    /* gruvbox dark bright purple */
    --orange: #fe8019;
  }
  :root[data-theme="light"] {
    --bg: #fbf1c7;        /* gruvbox light bg0 */
    --bg-alt: #f2e5bc;    /* gruvbox light bg0_s */
    --fg: #3c3836;        /* gruvbox light fg1 */
    --fg-muted: #7c6f64;  /* gruvbox light fg4 */
    --card-bg: #ebdbb2;   /* gruvbox light bg1 */
    --card-border: #d5c4a1; /* gruvbox light bg2 */
    --accent: #d65d0e;    /* gruvbox light orange */
    --shadow: rgba(60, 45, 20, 0.15);
    --blue: #076678;      /* gruvbox light blue */
    --violet: #8f3f71;    /* gruvbox light purple */
    --orange: #d65d0e;    /* gruvbox light orange */
  }
  :root {
    --bg-panel: var(--card-bg);
    --bg-panel-2: color-mix(in srgb, var(--card-bg) 82%, var(--fg));
    --lead: var(--card-border);
    --lead-bright: color-mix(in srgb, var(--card-border) 55%, var(--fg));
    --fg-dim: var(--fg-muted);
    --blue-dim: color-mix(in srgb, var(--blue) 18%, transparent);
    --orange-dim: color-mix(in srgb, var(--orange) 18%, transparent);
    --violet-dim: color-mix(in srgb, var(--violet) 18%, transparent);
    --radius: 3px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
    color: var(--fg);
    font-family: 'Manrope', -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  ::selection { background: var(--violet-dim); color: var(--fg); }

  .wrap {
    max-width: 74rem;
    margin: 0 auto;
    padding: 0 1.75rem;
  }

  /* faint leaded-glass grid across the whole page */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(var(--lead) 1px, transparent 1px),
      linear-gradient(90deg, var(--lead) 1px, transparent 1px);
    background-size: 88px 88px;
    opacity: 0.35;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black, transparent 75%);
  }

  /* ---- header ---------------------------------------------------- */
  header.site {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.5rem 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: var(--fg);
    flex: none;
  }
  .brand img { width: 1.9rem; height: 1.9rem; border-radius: 6px; display: block; }
  nav.site-links {
    display: flex;
    align-items: center;
    gap: 1.6rem;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--fg-muted);
    flex: 1 1 auto;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  nav.site-links a { text-decoration: none; transition: color 0.15s; }
  nav.site-links a:hover, nav.site-links a:focus-visible { color: var(--fg); }
  nav.site-links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex: none;
  }

  /* Language picker */
  .lang-picker { position: relative; }
  .lang-trigger {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--fg);
    padding: 0.4rem 0.6rem;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .lang-trigger:hover { border-color: var(--accent); }
  .lang-trigger .chevron { color: var(--fg-muted); font-size: 0.7rem; }
  .lang-menu {
    position: absolute;
    top: calc(100% + 0.4rem);
    right: 0;
    margin: 0;
    padding: 0.35rem;
    list-style: none;
    width: 12.5rem;
    max-height: 18rem;
    overflow-y: auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    box-shadow: 0 8px 24px var(--shadow);
    z-index: 20;
  }
  .lang-menu[hidden] { display: none; }
  .lang-option {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    width: 100%;
    font: inherit;
    text-align: left;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--fg);
    padding: 0.45rem 0.55rem;
    font-size: 0.84rem;
  }
  .lang-option:hover, .lang-option:focus-visible {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    outline: none;
  }
  .lang-option[aria-selected="true"] { font-weight: 700; color: var(--accent); }
  .flag {
    flex: none;
    display: inline-flex;
    width: 1.2rem;
    height: 1.2rem;
    line-height: 1.2rem;
  }
  .flag svg { width: 100%; height: 100%; border-radius: 2px; }

  .theme-btn {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--fg-muted);
    width: 2.1rem;
    height: 2.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  .theme-btn:hover { border-color: var(--accent); }

  /* ---- hero -------------------------------------------------------- */
  .hero {
    position: relative;
    z-index: 1;
    padding: 3.5rem 0 5rem;
    text-align: center;
  }
  .hero-shards {
    position: relative;
    width: min(46rem, 100%);
    height: 15rem;
    margin: 0 auto 1.2rem;
  }
  .shard { position: absolute; inset: 0; filter: blur(0.5px); }
  .shard svg { width: 100%; height: 100%; display: block; }
  .wordmark {
    position: relative;
    z-index: 2;
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: clamp(2.6rem, 9vw, 5.2rem);
    letter-spacing: 0.01em;
    margin: 0;
    background: linear-gradient(180deg, var(--fg) 0%, color-mix(in srgb, var(--fg) 55%, var(--bg)) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 46px color-mix(in srgb, var(--violet) 45%, transparent);
  }
  .tagline {
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    color: var(--fg-muted);
    max-width: 34rem;
    margin: 0 auto;
    font-weight: 500;
  }
  .tagline strong { color: var(--fg); font-weight: 700; }

  .cta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    margin-top: 2.4rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 0.98rem;
    text-decoration: none;
    padding: 0.85rem 1.5rem;
    border-radius: var(--radius);
    border: 1px solid transparent;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--violet));
    color: var(--bg);
    box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--violet) 55%, transparent);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 36px -10px color-mix(in srgb, var(--violet) 70%, transparent); }
  .btn-ghost {
    background: var(--bg-panel);
    color: var(--fg-muted);
    border-color: var(--lead-bright);
  }
  .btn-ghost:hover { color: var(--fg); border-color: var(--accent); transform: translateY(-2px); }
  .btn svg { width: 1.05rem; height: 1.05rem; flex: none; }

  .version-note {
    margin-top: 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--fg-dim);
  }
  .version-note a { color: var(--fg-dim); text-decoration: underline; text-underline-offset: 2px; }
  .version-note a:hover { color: var(--fg-muted); }

  /* ---- section shell ------------------------------------------------ */
  section { position: relative; z-index: 1; padding: 4rem 0; }
  .section-head { max-width: 38rem; margin: 0 auto 2.6rem; text-align: center; }
  .eyebrow {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.7rem;
  }
  .section-head h2 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: clamp(1.5rem, 3.4vw, 2rem);
    margin: 0 0 0.7rem;
  }
  .section-head p { color: var(--fg-muted); margin: 0; font-size: 1rem; }

  /* ---- panes / feature grid ------------------------------------------ */
  .panes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--lead);
    border: 1px solid var(--lead);
  }
  @media (max-width: 860px) {
    .panes { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 540px) {
    .panes { grid-template-columns: 1fr; }
  }
  .pane {
    background: var(--bg-panel);
    padding: 1.7rem 1.5rem;
    position: relative;
    overflow: hidden;
  }
  .pane::before {
    content: '';
    position: absolute;
    top: -30%;
    left: -20%;
    width: 60%;
    height: 160%;
    background: var(--pane-glow, var(--blue-dim));
    filter: blur(30px);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  .pane:hover::before, .pane:focus-within::before { opacity: 1; }
  .pane-icon {
    width: 2.1rem;
    height: 2.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    margin-bottom: 1rem;
    background: var(--pane-dim, var(--blue-dim));
    color: var(--pane-color, var(--blue));
  }
  .pane-icon svg { width: 1.15rem; height: 1.15rem; }
  .pane h3 {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.98rem;
    font-weight: 600;
    margin: 0 0 0.45rem;
    position: relative;
  }
  .pane p {
    font-size: 0.88rem;
    color: var(--fg-muted);
    margin: 0;
    position: relative;
  }

  /* ---- keyboard section ------------------------------------------------ */
  .kbd-groups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
    gap: 2.5rem;
  }
  .kbd-group h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin: 0 0 0.9rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--lead);
  }
  .kbd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.55rem 0;
    border-bottom: 1px dashed var(--lead);
    font-size: 0.9rem;
  }
  .kbd-row:last-child { border-bottom: none; }
  .kbd-row span:first-child { color: var(--fg-muted); }
  kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    font-weight: 600;
    background: var(--bg-panel-2);
    border: 1px solid var(--lead-bright);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0.2rem 0.5rem;
    color: var(--fg);
    white-space: nowrap;
  }

  /* ---- footer ------------------------------------------------------ */
  footer.site {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--lead);
    padding: 2.4rem 0 3rem;
    text-align: center;
  }
  footer.site p { color: var(--fg-dim); font-size: 0.82rem; margin: 0.3rem 0; }
  footer.site a { color: var(--fg-muted); text-decoration: none; }
  footer.site a:hover { color: var(--fg); text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .btn, .pane, .pane::before { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <a class="brand" href="#top">
      <img src="assets/icon.png" alt="" width="32" height="32">
      Vitralis
    </a>
    <nav class="site-links">
      <a href="#features" id="nav-features">Features</a>
      <a href="#shortcuts" id="nav-shortcuts">Shortcuts</a>
      <a href="https://github.com/Ran-n/vitralis" id="nav-source">Source</a>
      <a href="https://breren.com" id="nav-breren">Breren ↗</a>
    </nav>
    <div class="toolbar">
      <div class="lang-picker">
        <button class="lang-trigger" id="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="flag" id="lang-trigger-flag"></span>
          <span id="lang-trigger-name"></span>
          <span class="chevron">▾</span>
        </button>
        <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
      </div>
      <button class="theme-btn" id="theme-toggle" type="button"></button>
    </div>
  </header>
</div>

<main id="top">
  <div class="wrap">
    <section class="hero">
      <div class="hero-shards" aria-hidden="true">
        <div class="shard">
          <svg viewBox="0 0 640 220" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="var(--blue)" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="var(--blue)" stop-opacity="0.05"/>
              </linearGradient>
              <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="var(--orange)" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="var(--orange)" stop-opacity="0.05"/>
              </linearGradient>
              <linearGradient id="gViolet" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="var(--violet)" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="var(--violet)" stop-opacity="0.05"/>
              </linearGradient>
            </defs>
            <polygon class="glint" data-tone="blue" points="40,190 130,30 210,70 150,190" fill="url(#gBlue)"/>
            <polygon class="glint" data-tone="orange" points="220,190 260,20 360,10 330,190" fill="url(#gOrange)"/>
            <polygon class="glint" data-tone="violet" points="350,190 400,40 520,60 470,190" fill="url(#gViolet)"/>
            <polygon class="glint" data-tone="blue" points="480,190 540,80 610,110 580,190" fill="url(#gBlue)"/>
            <g stroke="var(--lead-bright)" stroke-width="1.4" opacity="0.9">
              <line x1="40" y1="190" x2="130" y2="30"/>
              <line x1="130" y1="30" x2="210" y2="70"/>
              <line x1="210" y1="70" x2="150" y2="190"/>
              <line x1="220" y1="190" x2="260" y2="20"/>
              <line x1="260" y1="20" x2="360" y2="10"/>
              <line x1="360" y1="10" x2="330" y2="190"/>
              <line x1="350" y1="190" x2="400" y2="40"/>
              <line x1="400" y1="40" x2="520" y2="60"/>
              <line x1="520" y1="60" x2="470" y2="190"/>
              <line x1="480" y1="190" x2="540" y2="80"/>
              <line x1="540" y1="80" x2="610" y2="110"/>
              <line x1="610" y1="110" x2="580" y2="190"/>
            </g>
          </svg>
        </div>
      </div>
      <h1 class="wordmark">VITRALIS</h1>
      <p class="tagline" id="hero-tagline"></p>
      <div class="cta-row">
        <a class="btn btn-primary" id="download-btn" href="https://github.com/Ran-n/vitralis/releases/latest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span id="download-label">Download for Windows</span>
        </a>
        <a class="btn btn-ghost" href="https://github.com/Ran-n/vitralis" id="btn-source">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.3-3.2-.1-.3-.6-1.6.1-3.2 0 0 1.1-.3 3.5 1.3a12 12 0 0 1 6.4 0c2.4-1.6 3.5-1.3 3.5-1.3.7 1.6.2 2.9.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.7 5.6-5.4 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3Z"/></svg>
          <span id="btn-source-label">Source on GitHub</span>
        </a>
      </div>
      <p class="version-note">
        <a href="https://github.com/Ran-n/vitralis/releases" id="version-link">See all releases</a>
        <span id="version-rest"> · PayBack License</span>
      </p>
    </section>

    <section id="features">
      <div class="section-head">
        <p class="eyebrow" id="eyebrow-what"></p>
        <h2 id="features-h2"></h2>
        <p id="features-p"></p>
      </div>
      <div class="panes">
        <div class="pane" style="--pane-color: var(--blue); --pane-dim: var(--blue-dim); --pane-glow: var(--blue-dim);">
          <div class="pane-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg></div>
          <h3 id="pane1-t"></h3>
          <p id="pane1-d"></p>
        </div>
        <div class="pane" style="--pane-color: var(--orange); --pane-dim: var(--orange-dim); --pane-glow: var(--orange-dim);">
          <div class="pane-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.2-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16c3.3 0 6-2.7 6-6 0-4.4-4.5-8-10-8Z"/></svg></div>
          <h3 id="pane2-t"></h3>
          <p id="pane2-d"></p>
        </div>
        <div class="pane" style="--pane-color: var(--violet); --pane-dim: var(--violet-dim); --pane-glow: var(--violet-dim);">
          <div class="pane-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v8h8"/></svg></div>
          <h3 id="pane3-t"></h3>
          <p id="pane3-d"></p>

  var currentLang = detectLang();

  function detectLang() {
    var stored = localStorage.getItem('vitralis-lang');
    if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
    var candidates = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < candidates.length; i++) {
      var code = (candidates[i] || '').slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(code) !== -1) return code;
    }
    return 'en';
  }

  function t(key) {
    var dict = STRINGS[currentLang] || STRINGS.en;
    return dict[key] || STRINGS.en[key] || key;
  }

  function boldify(str) {
    var out = document.createElement('span');
    var parts = str.split('**');
    parts.forEach(function (part, i) {
      if (i % 2 === 1) {
        var strong = document.createElement('strong');
        strong.textContent = part;
        out.appendChild(strong);
      } else {
        out.appendChild(document.createTextNode(part));
      }
    });
    return out;
  }

  function applyTexts() {
    document.getElementById('nav-features').textContent = t('nav_features');
    document.getElementById('nav-shortcuts').textContent = t('nav_shortcuts');
    document.getElementById('nav-source').textContent = t('nav_source');
    document.getElementById('nav-breren').textContent = t('nav_breren');

    var tagline = document.getElementById('hero-tagline');
    tagline.innerHTML = '';
    tagline.appendChild(boldify(t('hero_tagline')));

    var dlLabel = document.getElementById('download-label');
    if (dlLabel.dataset.version) {
      dlLabel.textContent = t('btn_download') + ' (' + dlLabel.dataset.version + ')';
    } else {
      dlLabel.textContent = t('btn_download');
    }
    document.getElementById('btn-source-label').textContent = t('btn_source');
    document.getElementById('version-link').textContent = t('version_link');
    document.getElementById('version-rest').textContent = t('version_rest');

    document.getElementById('eyebrow-what').textContent = t('eyebrow_what');
    document.getElementById('features-h2').textContent = t('features_h2');
    document.getElementById('features-p').textContent = t('features_p');

    for (var i = 1; i <= 6; i++) {
      document.getElementById('pane' + i + '-t').textContent = t('pane' + i + '_t');
      document.getElementById('pane' + i + '-d').textContent = t('pane' + i + '_d');
    }

    document.getElementById('eyebrow-short').textContent = t('eyebrow_short');
    document.getElementById('shortcuts-h2').textContent = t('shortcuts_h2');
    document.getElementById('shortcuts-p').textContent = t('shortcuts_p');

    document.getElementById('kbd-global-h').textContent = t('kbd_global_h');
    document.getElementById('kbd-modes-h').textContent = t('kbd_modes_h');
    document.getElementById('kbd-tools-h').textContent = t('kbd_tools_h');
    document.getElementById('kbd-fine-h').textContent = t('kbd_fine_h');

    document.getElementById('lbl-focus-toolbar').textContent = t('lbl_focus_toolbar');
    document.getElementById('lbl-toggle-draw').textContent = t('lbl_toggle_draw');
    document.getElementById('lbl-toggle-pan').textContent = t('lbl_toggle_pan');

    document.getElementById('lbl-hide-show').textContent = t('lbl_hide_show');
    document.getElementById('lbl-undo').textContent = t('lbl_undo');
    document.getElementById('lbl-clear-all').textContent = t('lbl_clear_all');
    document.getElementById('lbl-pen').textContent = t('lbl_pen');
    document.getElementById('lbl-eraser').textContent = t('lbl_eraser');

  // ---- language picker --------------------------------------------------

  function setupLangPicker() {
    var trigger = document.getElementById('lang-trigger');
    var menu = document.getElementById('lang-menu');
    var triggerFlag = document.getElementById('lang-trigger-flag');
    var triggerName = document.getElementById('lang-trigger-name');

    LANGUAGES.forEach(function (lang) {
      var li = document.createElement('li');
      li.setAttribute('role', 'presentation');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lang-option';
      btn.setAttribute('role', 'option');
      btn.setAttribute('aria-selected', String(lang.code === currentLang));
      btn.innerHTML = '<span class="flag">' + lang.flag + '</span><span>' + lang.name + '</span>';
      btn.addEventListener('click', function () {
        selectLang(lang.code);
        closeMenu();
      });
      li.appendChild(btn);
      menu.appendChild(li);
    });

    updateTrigger();

    trigger.addEventListener('click', function () {
      if (menu.hidden) openMenu(); else closeMenu();
    });
    document.addEventListener('click', function (e) {
      if (!menu.hidden && !e.target.closest('.lang-picker')) closeMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.hidden) { closeMenu(); trigger.focus(); }
    });

    function openMenu() { menu.hidden = false; trigger.setAttribute('aria-expanded', 'true'); }
    function closeMenu() { menu.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
    function updateTrigger() {
      var lang = BY_CODE[currentLang];
      triggerFlag.innerHTML = lang.flag;
      triggerName.textContent = lang.name;
      Array.prototype.forEach.call(menu.querySelectorAll('.lang-option'), function (btn, i) {
        btn.setAttribute('aria-selected', String(LANGUAGES[i].code === currentLang));
      });
    }
    setupLangPicker._update = updateTrigger;
  }

  function selectLang(code) {
    currentLang = code;
    localStorage.setItem('vitralis-lang', code);
    document.documentElement.lang = code;
    setupLangPicker._update();
    applyTexts();
  }

  // ---- theme ----------------------------------------------------------

  function effectiveTheme() {
    var stored = localStorage.getItem('vitralis-theme');
    if (stored) return stored;
    return 'dark'; // default look; remembered once the visitor toggles it
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    updateThemeButtonLabel();
  }
  function updateThemeButtonLabel() {
    var theme = document.documentElement.getAttribute('data-theme');
    var btn = document.getElementById('theme-toggle');
    var label = theme === 'dark' ? t('theme_light') : t('theme_dark');
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }
  function setupThemeToggle() {
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('vitralis-theme', next);
      applyTheme(next);
    });
  }

  setupLangPicker();
  setupThemeToggle();
  applyTheme(effectiveTheme());
  document.documentElement.lang = currentLang;
  applyTexts();

  // ---- latest release -----------------------------------------------

  var REPO = 'Ran-n/vitralis';
  fetch('https://api.github.com/repos/' + REPO + '/releases/latest')
    .then(function (r) { if (!r.ok) throw new Error('bad status'); return r.json(); })
    .then(function (release) {
      var exe = (release.assets || []).find(function (a) { return /\.exe$/i.test(a.name); });
      if (exe) document.getElementById('download-btn').href = exe.browser_download_url;
      if (release.tag_name) {
        document.getElementById('download-label').dataset.version = release.tag_name;
        applyTexts();
      }
    })
    .catch(function () {}); // fall back to the static "latest" releases link already in the markup

  // ---- hero shard glint ------------------------------------------------

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var svg = document.querySelector('.hero-shards svg');
    if (svg) {
      var polys = Array.prototype.slice.call(svg.querySelectorAll('.glint'));
      document.querySelector('.hero-shards').addEventListener('pointermove', function (e) {
        var rect = svg.getBoundingClientRect();
        var mx = (e.clientX - rect.left) / rect.width;
        polys.forEach(function (p, i) {
          var cx = [0.23, 0.45, 0.65, 0.83][i] || 0.5;
          var dist = Math.abs(mx - cx);
          var glow = Math.max(0, 1 - dist * 3.2);
          p.style.opacity = 0.6 + glow * 0.4;
        });
      });
    }
  }
})();
