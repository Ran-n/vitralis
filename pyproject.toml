[project]
name = "vitralis"
version = "1.0.2"
description = "Persistent screen overlay for drawing annotations over live desktop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyqt6>=6.11.0",
    "pywin32>=308; sys_platform == 'win32'",
    "keyboard>=0.13",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.11.0",
]
