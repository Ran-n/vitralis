<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- PT-style vertical bicolor: green 2/5, red 3/5 -->
  <rect width="256" height="480" fill="#006600"/>
  <rect x="256" width="384" height="480" fill="#CC0000"/>

  <!-- Yellow circle on the green/red seam -->
  <circle cx="256" cy="240" r="88" fill="#FFCC00"/>

  <!-- Bottom stripe: green above the diagonal, white below -->
  <!-- The diagonal goes from (640,0) to (0,480): y = 480 - (480/640)*x = 480 - 0.75x -->
  <!-- Above diagonal in the bottom stripe region -->
  <clipPath id="above-diag">
    <polygon points="0,320 640,320 640,0 0,480"/>
  </clipPath>
  <clipPath id="below-diag">
    <polygon points="0,480 640,480 640,0 0,480"/>
  </clipPath>

  <!-- White: bottom stripe below the diagonal -->
  <rect y="320" width="640" height="160" fill="#FFFFFF" clip-path="url(#below-diag)"/>
  <!-- Green: bottom stripe above the diagonal -->
  <rect y="320" width="640" height="160" fill="#006600" clip-path="url(#above-diag)"/>

  <!-- Galician blue diagonal from top-right to bottom-left, always on top -->
  <line x1="640" y1="0" x2="0" y2="480" stroke="#0099CC" stroke-width="90"/>
</svg>
