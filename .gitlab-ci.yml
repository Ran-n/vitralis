stages:
  - check
  - deploy

# the tests need Windows (see .github/workflows/ci.yml); the linter runs anywhere
lint:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  script:
    # the version uv.lock pins: a newer ruff may format differently
    - uvx ruff@0.15.12 format --check .
    - uvx ruff@0.15.12 check .

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r docs/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
